# External Secrets Operator: SSM Parameter Store 의 값을 K8s Secret 으로 동기화한다.
# AWS 권한은 Terraform 50-platform 이 Pod Identity 로 연결해 둔다 (external-secrets/external-secrets).
# 이 Application 이 CRD 를 설치하고, ClusterSecretStore 는 다음 wave 의 external-secrets-config 가 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.14.0"
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/values/external-secrets.yaml
    - repoURL: https://github.com/jaehwan01101/EKS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO 의 CRD 는 너무 커서 기본 방식(client-side apply)으로는 반영이 실패한다.
      # client-side apply 는 리소스 전체를 last-applied-configuration 어노테이션에 저장하는데
      # 이 CRD 는 그 한도(262144 바이트)를 넘는다. server-side apply 는 API 서버가 변경을 추적해 한도가 없다.
      - ServerSideApply=true
