# ClusterSecretStore 를 적용한다. ESO 의 CRD 와 웹훅이 준비된 뒤여야 해서 wave 1 이다.
#
# CRD 순서 문제: ESO 를 설치하기 전에 ClusterSecretStore 를 적용하면
#   "no matches for kind ClusterSecretStore" 로 실패한다. 아래 세 가지로 푼다.
#   1) sync-wave 로 ESO(wave 0)가 Healthy 가 된 다음에 적용
#   2) SkipDryRunOnMissingResource: CRD 가 아직 없을 때 사전 검증을 건너뜀
#   3) retry: 웹훅이 늦게 뜨는 경우 재시도
#
# 같은 디렉터리의 origin-verify-externalsecret.yaml 은 앱 네임스페이스(reservation)용이라
# 여기서는 제외하고 앱 쪽 매니페스트에서 적용한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jaehwan01101/EKS.git
    targetRevision: main
    path: gitops/external-secrets
    directory:
      include: "cluster-secret-store.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
