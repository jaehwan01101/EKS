# SSM Parameter Store 를 시크릿 소스로 쓰는 ClusterSecretStore.
# apiVersion 은 ESO 1.x 기준(external-secrets.io/v1). 구버전(v1beta1)이면 apiVersion 만 바꾸면 된다.
#
# auth 블록을 생략하면 ESO 컨트롤러 Pod 자신의 자격 증명(EKS Pod Identity)을 쓴다.
# → Git 에는 키도, 역할 ARN 도 들어가지 않는다. 역할 연결은 Terraform(40-eks 또는 50-platform)의
#   aws_eks_pod_identity_association 이 담당한다. (서비스 어카운트: external-secrets/external-secrets)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
