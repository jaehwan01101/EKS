# CloudFront → ALB 구간의 시크릿 헤더 값을 SSM 에서 가져와 K8s Secret 으로 만든다.
# 값은 Terraform 60-edge 가 만든 SecureString (/reservation/edge/origin-verify-header).
# 이 파일에는 값이 아니라 "어디서 가져올지"만 있으므로 Git 에 올려도 안전하다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origin-verify
  namespace: reservation
spec:
  # 이 간격마다 SSM 을 다시 읽어 Secret 을 갱신한다.
  # 단, 앱은 기동할 때만 env 를 읽으므로 갱신된 값을 쓰려면 Pod 재시작이 필요하다 (README 참고).
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: origin-verify # 생성될 K8s Secret 이름
    creationPolicy: Owner
  data:
    - secretKey: ORIGIN_VERIFY_SECRET # Secret 의 키 = 앱이 읽는 env 이름
      remoteRef:
        key: /reservation/edge/origin-verify-header

# Rollout(또는 Deployment)의 컨테이너에서 쓰는 방법:
#
#   env:
#     - name: ORIGIN_VERIFY_ENABLED
#       value: "true"
#   envFrom:
#     - secretRef:
#         name: origin-verify
#
# Secret 이 아직 없으면 Pod 는 ContainerCreating 에서 멈추고(CreateContainerConfigError),
# 시크릿이 비어 있으면 앱이 기동에 실패한다. 어느 쪽이든 "검증 없이 열린 채로" 뜨지 않는다.
